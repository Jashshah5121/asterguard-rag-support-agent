<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aster &amp; Row — Support</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="26" height="26">
            <circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
            <path d="M20 6 C 24 14, 24 26, 20 34 C 16 26, 16 14, 20 6 Z" fill="currentColor" opacity="0.9"/>
            <path d="M6 20 C 14 16, 26 16, 34 20" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.5"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Aster &amp; Row</h1>
          <p>Customer Support</p>
        </div>
      </div>

      <div class="header-actions">
        <span class="status" id="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-label">Checking&hellip;</span>
        </span>
        <button class="btn-ghost" id="new-chat-btn" type="button">New conversation</button>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <!-- messages injected here -->
    </main>

    <div class="quick-actions" id="quick-actions">
      <button type="button" data-prompt="What's your return policy?">Return policy</button>
      <button type="button" data-prompt="Do you ship internationally?">International shipping</button>
      <button type="button" data-prompt="Can you check the status of my order?">Track an order</button>
      <button type="button" data-prompt="What does the TrailPlus membership include?">TrailPlus membership</button>
    </div>

    <form class="composer" id="composer">
      <textarea
        id="message-input"
        rows="1"
        placeholder="Ask about an order, a policy, or anything else&hellip;"
        aria-label="Message"
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
        </svg>
      </button>
    </form>

    <p class="disclaimer">Aster &amp; Row's assistant can make mistakes. It will say when it isn't sure and loop in a person when needed.</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
